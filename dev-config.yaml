# Local development configuration. Not shipped in the package.
server:
  # An absolute path under the user's runtime directory: /run/claude-scheduler
  # is not writable by a normal user, and a relative path would resolve
  # against the process working directory, which is why it is rejected.
  # Overridden by `make run`, which fills in $XDG_RUNTIME_DIR.
  socket: /tmp/claude-scheduler-dev.sock
  socket_mode: 0600
paths:
  data_dir: ./.dev/data
  log_dir: ./.dev/logs
executor:
  max_concurrent: 2
  default_timeout: 10m
  default_max_budget_usd: 0.5
  misfire_grace: 0   # no catch-up in development
notify:
  desktop:
    enabled: true
